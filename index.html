<script>
const form=document.querySelector('#unlock-form'),passwordInput=document.querySelector('#password'),button=document.querySelector('#unlock-button'),error=document.querySelector('#error');
const bytes=value=>Uint8Array.from(atob(value),char=>char.charCodeAt(0));
let payload=null,validPayload=false;
try{
 payload=JSON.parse(document.querySelector('#encrypted-payload').textContent);
 validPayload=payload.version===1&&payload.algorithm==='AES-256-GCM'&&payload.kdf==='PBKDF2-SHA256'&&payload.iterations===310000&&typeof payload.salt==='string'&&typeof payload.nonce==='string'&&typeof payload.ciphertext==='string'&&bytes(payload.salt).length===16&&bytes(payload.nonce).length===12&&bytes(payload.ciphertext).length>=16;
}catch{validPayload=false;}
form.addEventListener('submit',async event=>{
 event.preventDefault();button.disabled=true;error.textContent='';
 if(!validPayload){error.textContent='Die verschlüsselte Seite ist beschädigt.';button.disabled=false;return;}
 try{
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(passwordInput.value),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  const aad=new TextEncoder().encode(`kochplaner:v${payload.version}|${payload.algorithm}|${payload.kdf}|${payload.iterations}`);
  const plaintext=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.nonce),additionalData:aad},key,bytes(payload.ciphertext));
  const html=new TextDecoder().decode(plaintext);passwordInput.value='';document.open();document.write(html);document.close();
 }catch{error.textContent='Passwort falsch.';passwordInput.select();button.disabled=false;}
});
